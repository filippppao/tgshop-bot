version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tgshop_bot
    restart: always
    env_file:
      - ./telegram-shop-bot-master/telegram-shop-bot-master/.env.prod.docker
    environment:
      # ВАЖНО: Эти пути теперь внутри контейнера указывают на постоянный Volume
      - DB_PATH=/app/data/shop.db
      - PHOTOS_DIR=/app/data/product_photos
    volumes:
      # Мапим ВНЕШНИЙ ИМЕНОВАННЫЙ volume, который НЕ УДАЛЯЕТСЯ при обновлении кода
      - bot_data:/app/data

volumes:
  bot_data:
    # Задаем фиксированное имя, чтобы Docker не добавлял префикс имени папки.
    # Это гарантирует, что база останется той же даже при смене папки деплоя.
    name: tgshop_bot_persistent_data
