name: Deploy to Server

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Create .env file from GitHub Secrets
        run: |
          # Файл .env.prod.docker создается заново на каждый деплой,
          # но база данных в это время находится в постоянном Docker Volume
          echo "${{ secrets.PROD_ENV }}" > ./telegram-shop-bot-master/telegram-shop-bot-master/.env.prod.docker

      - name: Create credentials.json from GitHub Secrets
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > ./telegram-shop-bot-master/telegram-shop-bot-master/credentials.json

      - name: Build and deploy containers
        run: |
          # ВАЖНО: Мы не используем -v в docker compose down, поэтому база данных сохраняется
          docker compose build --pull
          docker compose down --remove-orphans
          docker compose up -d
